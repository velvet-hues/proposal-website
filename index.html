<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentines Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Courier+Prime:wght@700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>


    .bounce2 {
      animation: bounce2 2s ease infinite;
    }
    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
    /* Floating Hearts Animation Background */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart-particle {
            position: absolute;
            bottom: -20px;
            animation: floatUp 15s linear infinite;
            opacity: 0.6;
            color: #ffb7c5;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f5; /* Lavender Blush */
            overflow-x: hidden;
        }
    body{
      font-family: 'Caveat', cursive;
    }
  </style>
</head>
<body class="gradient-background">
      <!-- Floating Background Hearts -->
    <div class="heart-bg" id="heartContainer"></div>
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">
      <img id="imageDisplay" src="./images/image1.gif" alt="Cute kitten with flowers" class="h-[300px]" style="object-fit: cover; border-radius: 20%;" />
      <h2 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="font-size: 5rem;">Will you be my Valentine?</h2>
<div id="responseButtons" class="flex gap-6 items-center justify-center mt-10">
    <!-- Yes Button -->
    <button id="yesButton"
        class="bounce2 group relative inline-flex items-center justify-center whitespace-nowrap font-typewriter font-bold text-lg px-8 py-3 min-w-[120px] rounded-lg bg-gradient-to-br from-green-400 to-green-600 text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:pointer-events-none overflow-hidden text-4xl">
        <span class="relative z-10 flex items-center gap-2">
            Yes
        </span>
        <!-- Shine effect on hover -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-0 group-hover:opacity-20 translate-x-[-100%] group-hover:translate-x-[100%] transition-all duration-500"></div>
    </button>

    <!-- No Button -->
    <button id="noButton"
        class="group relative inline-flex items-center justify-center whitespace-nowrap font-typewriter font-bold text-lg px-8 py-3 min-w-[120px] rounded-lg bg-gradient-to-br from-red-400 to-red-600 text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:pointer-events-none overflow-hidden text-4xl">
        <span class="relative z-10 flex items-center gap-2">
            No
        </span>
        <!-- Shine effect on hover -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-0 group-hover:opacity-20 translate-x-[-100%] group-hover:translate-x-[100%] transition-all duration-500"></div>
    </button>
</div>

    </div>
  </div>
        <audio id="bg-audio" src="./images/audio1.mp3" loop hidden></audio>

        <script>
  const bgAudio = document.getElementById('bg-audio');

  // Try to play after first user interaction (needed for most browsers)
  function startBgAudio() {
    bgAudio.play().catch(() => {
      // if blocked, you could show a small "Tap to enable sound" later
      console.warn('Autoplay blocked by browser');
    });
    document.removeEventListener('click', startBgAudio);
    document.removeEventListener('touchstart', startBgAudio);
  }

  document.addEventListener('click', startBgAudio);
  document.addEventListener('touchstart', startBgAudio);
        </script>
  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
  
    let noClickCount = 0;
    let buttonHeight = 48; // Starting height in pixels
    let buttonWidth = 80;
    let fontSize = 20; // Starting font size in pixels
    const imagePaths = [
      "./images/image1.gif",
      "./images/image2.gif",
      "./images/image3.gif",
      "./images/image4.gif",
      "./images/image5.gif",
      "./images/image6.gif",
      "./images/image7.gif"
    ];
    let x = 100
    noButton.addEventListener('click', function() {
      if (noClickCount < x) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount%7];
        buttonHeight += 35; // Increase height by 5px on each click
        buttonWidth += 35;
        fontSize += 25; // Increase font size by 1px on each click
        yesButton.style.height = `${buttonHeight}px`; // Update button height
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`; // Update font size
        if (noClickCount < x) {
          noButton.textContent = ["No", "Are you sure?", "Pookie please", "Don't do this to me :(", "You're breaking my heart", "I'm gonna cry...","No", "Are you sure?", "What if I asked really nicely?", "Pretty please", "With a chocolate rice cake on top", "What about a matcha frostie", "PLEASE POOKIE", "But :*(", "I am going to die", "Yep im dead", "ok ur talking to nathan's ghost", "please babe", ":((((", "PRETTY PLEASE", "Estoy muerto", "No :(",][noClickCount];
        }
      }
    });
  
    yesButton.addEventListener('click', () => {
      imageDisplay.src = './images/image7.gif'; // Change to image7.gif
      valentineQuestion.classList.add('mt-20')
      valentineQuestion.textContent = "Yayyy!! :3"; // Change the question text
      responseButtons.style.display = 'none'; // Hide both buttons
      confetti(); // Trigger confetti animation
    });
    // Background Hearts Generator
    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerHTML = '<i class="fas fa-heart"></i>';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 5 + 10) + 's';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        
        document.getElementById('heartContainer').appendChild(heart);
        
        setTimeout(() => {
            heart.remove();
        }, 15000);
    }

        setInterval(createHeart, 500);
        function createConfetti() {
            const colors = ['#ff0000', '#ff69b4', '#ff1493', '#ffd700'];
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.zIndex = '100';
            confetti.style.borderRadius = '50%';
            document.body.appendChild(confetti);

            const speed = Math.random() * 3 + 2;
            let top = -10;
            let angle = 0;

            const fall = setInterval(() => {
                top += speed;
                angle += 5;
                confetti.style.top = top + 'px';
                confetti.style.transform = `rotate(${angle}deg)`;

                if (top > window.innerHeight) {
                    clearInterval(fall);
                    confetti.remove();
                }
            }, 20);
        }

        // Love Calculator Logic
        function calculateLove() {
            const bar = document.getElementById('loveBar');
            const result = document.getElementById('loveResult');
            
            // Reset
            bar.style.width = '0%';
            result.style.opacity = '0';
            
            setTimeout(() => {
                bar.style.width = '100%';
                
                setTimeout(() => {
                    result.innerText = 'Infinity% (Obviously) 🙄';
                    result.style.opacity = '1';
                    
                    // Trigger confetti again because why not
                    for(let i=0; i<30; i++) createConfetti();
                }, 1000);
            }, 100);
        }

        // Coupon interaction
        function redeemCoupon(element) {
            // Visual feedback handled by CSS active state primarily, 
            // but let's add a little alert or visual change
            const text = element.querySelector('.text-green-500');
            text.style.opacity = '1';
            setTimeout(() => {
                text.style.opacity = '0';
            }, 2000);
        }

        // Secret Message
        function showSecret() {
            document.getElementById('secretMsg').classList.add('show-msg');
        }
    </script>
  </script>  
</body>

</html>
